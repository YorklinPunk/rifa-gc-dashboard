
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reporte de ventas</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6fa;
            color: #2f3542;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            color: #747d8c;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            font-size: 14px;
            color: #747d8c;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 32px;
            font-weight: bold;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .panel {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .panel h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 13px 10px;
            background: #f1f2f6;
            font-size: 14px;
        }

        td {
            padding: 13px 10px;
            border-bottom: 1px solid #eee;
        }

        th:last-child,
        td:last-child {
            text-align: right;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .total-row {
            font-weight: bold;
            background: #f1f2f6;
        }

        .total-row td {
            border-bottom: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #747d8c;
        }

        .error {
            display: none;
            background: #ffe0e0;
            color: #c0392b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .updated {
            margin-top: 15px;
            font-size: 12px;
            color: #747d8c;
            text-align: right;
        }

        @media (max-width: 800px) {
            body {
                padding: 15px;
            }

            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Reporte de ventas</h1>
        <p>Resumen de números vendidos por vendedor</p>
    </div>

    <div id="error" class="error"></div>

    <!-- RESUMEN -->
    <div class="cards">

        <div class="card">
            <div class="card-title">Total de números vendidos</div>
            <div id="totalVentas" class="card-value">0</div>
        </div>

        <div class="card">
            <div class="card-title">Vendedores</div>
            <div id="totalVendedores" class="card-value">0</div>
        </div>

    </div>

    <div class="content">

        <!-- TABLA -->
        <div class="panel">

            <h2>Ventas por vendedor</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Vendedor</th>
                            <th>Números vendidos</th>
                        </tr>
                    </thead>

                    <tbody id="tablaVentas">

                        <tr>
                            <td colspan="2" class="loading">
                                Cargando información...
                            </td>
                        </tr>

                    </tbody>

                    <tfoot>

                        <tr class="total-row">
                            <td>TOTAL GENERAL</td>
                            <td id="totalTabla">0</td>
                        </tr>

                    </tfoot>

                </table>

            </div>

            <div id="ultimaActualizacion" class="updated"></div>

        </div>

        <!-- GRAFICO -->
        <div class="panel">

            <h2>Números vendidos</h2>

            <canvas id="ventasChart"></canvas>

        </div>

    </div>

</div>


<script>

    /*
     * ==========================================
     * CONFIGURACIÓN
     * ==========================================
     */

    const API_URL = "https://rifa-webapi.abexacloud.com/api/Ventas";


    let chart = null;


    /*
     * ==========================================
     * OBTENER INFORMACIÓN
     * ==========================================
     */

    async function obtenerVentas() {

        try {

            mostrarError("");

            const response = await fetch(API_URL, {
                method: "GET"
            });

            if (!response.ok) {
                throw new Error(
                    `Error HTTP ${response.status}`
                );
            }

            const data = await response.json();

            procesarVentas(data);

        } catch (error) {

            console.error(error);

            mostrarError(
                "No se pudo obtener la información del servidor."
            );

        }

    }


    /*
     * ==========================================
     * PROCESAR JSON
     * ==========================================
     */

    function procesarVentas(data) {

        /*
         * Ejemplo esperado:
         *
         * [
         *   {
         *      "vendedor": "Yorklin",
         *      "numeros": [1, 2, 3]
         *   }
         * ]
         */

        const ventasPorVendedor = {};


        data.forEach(venta => {

            const vendedor =
                venta.vendedor || "Sin vendedor";

            const cantidad =
                Array.isArray(venta.numeros)
                    ? venta.numeros.length
                    : 0;


            if (!ventasPorVendedor[vendedor]) {

                ventasPorVendedor[vendedor] = 0;

            }

            ventasPorVendedor[vendedor] += cantidad;

        });


        /*
         * Convertimos a array
         */

        const vendedores =
            Object.entries(ventasPorVendedor)
                .map(([vendedor, cantidad]) => ({
                    vendedor,
                    cantidad
                }))
                .sort((a, b) => b.cantidad - a.cantidad);


        /*
         * Total general
         */

        const totalGeneral =
            vendedores.reduce(
                (total, vendedor) =>
                    total + vendedor.cantidad,
                0
            );


        /*
         * Actualizar tarjetas
         */

        document.getElementById("totalVentas")
            .textContent = totalGeneral;

        document.getElementById("totalTabla")
            .textContent = totalGeneral;

        document.getElementById("totalVendedores")
            .textContent = vendedores.length;


        /*
         * Actualizar tabla
         */

        construirTabla(vendedores);


        /*
         * Actualizar gráfico
         */

        construirGrafico(vendedores);


        /*
         * Fecha de actualización
         */

        document.getElementById("ultimaActualizacion")
            .textContent =
                "Última actualización: " +
                new Date().toLocaleString("es-PE");

    }


    /*
     * ==========================================
     * CONSTRUIR TABLA
     * ==========================================
     */

    function construirTabla(vendedores) {

        const tbody =
            document.getElementById("tablaVentas");

        tbody.innerHTML = "";


        vendedores.forEach(vendedor => {

            const fila =
                document.createElement("tr");


            fila.innerHTML = `

                <td>
                    ${escapeHtml(vendedor.vendedor)}
                </td>

                <td>
                    <strong>
                        ${vendedor.cantidad}
                    </strong>
                </td>

            `;


            tbody.appendChild(fila);

        });

    }


    /*
     * ==========================================
     * CONSTRUIR GRÁFICO
     * ==========================================
     */

    function construirGrafico(vendedores) {

        const canvas =
            document.getElementById("ventasChart");

        /*
         * Si ya existe un gráfico,
         * lo destruimos antes de crear otro.
         */

        if (chart) {

            chart.destroy();

        }


        chart = new Chart(canvas, {

            type: "bar",

            data: {

                labels:
                    vendedores.map(
                        vendedor => vendedor.vendedor
                    ),

                datasets: [

                    {

                        label: "Números vendidos",

                        data:
                            vendedores.map(
                                vendedor => vendedor.cantidad
                            ),

                        borderWidth: 1

                    }

                ]

            },

            options: {

                responsive: true,

                plugins: {

                    legend: {
                        display: false
                    }

                },

                scales: {

                    y: {

                        beginAtZero: true,

                        ticks: {

                            precision: 0

                        }

                    }

                }

            }

        });

    }


    /*
     * ==========================================
     * MANEJO DE ERRORES
     * ==========================================
     */

    function mostrarError(mensaje) {

        const error =
            document.getElementById("error");

        if (!mensaje) {

            error.style.display = "none";
            error.textContent = "";

            return;

        }

        error.textContent = mensaje;
        error.style.display = "block";

    }


    /*
     * ==========================================
     * SEGURIDAD BÁSICA PARA HTML
     * ==========================================
     */

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    /*
     * ==========================================
     * INICIALIZAR
     * ==========================================
     */

    obtenerVentas();


    /*
     * Actualizar cada 60 segundos
     *
     * Si no quieres actualización automática,
     * puedes eliminar este bloque.
     */

    setInterval(
        obtenerVentas,
        60 * 1000
    );

</script>

</body>
</html>
